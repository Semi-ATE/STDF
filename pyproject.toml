[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "Semi-ATE-stdf"
dynamic = ["version"]
description = "Standard Test Data Format (STDF) library - Python bindings to Rust implementation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["stdf", "semiconductor", "test", "ate"]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/yourusername/STDF"
Repository = "https://github.com/yourusername/STDF"
Documentation = "https://github.com/yourusername/STDF/tree/main/docs"

[tool.maturin]
features = ["python"]
module-name = "stdf"
python-source = "python"
