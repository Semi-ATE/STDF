[package]
name = "semi-ate-stdf"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
description = "Standard Test Data Format (STDF) library and tools - Rust implementation with Python bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/STDF"
keywords = ["stdf", "semiconductor", "test", "ate"]
categories = ["parser-implementations", "encoding"]

[lib]
name = "stdf_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stdf"
path = "src/stdf.rs"

[[bin]]
name = "atdf"
path = "src/atdf.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
byte = "0.2"
memmap2 = "0.9"
stdf-record-derive = { path = "stdf-record-derive", version = "0.2" }
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
lz4 = "1.24"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
sevenz-rust = "0.6"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
infer = "0.16"
regex = "1.11"
sha2 = "0.10"
walkdir = "2.4"

# Visualization dependencies
rust_xlsxwriter = "0.79"
plotters = "0.3"
printpdf = "0.7"
anyhow = "1.0"
# polars = { version = "0.44", features = ["parquet", "lazy"] }  # TODO: Re-enable when pyo3 version conflict is resolved

[features]
default = []
python = ["pyo3"]

[profile.release]
lto = true
codegen-units = 1
strip = true
